  <header class="view-header">
    <h2 data-i18n="nav.files">Arquivos</h2>
    <span class="view-sub" data-i18n="files.subtitle">internal storage and connected disks</span>
  </header>

  <div id="files-roots" class="files-roots">
    <p class="empty-row" data-i18n="common.loading">loading…</p>
  </div>

  <section id="files-panel" class="panel files-panel">
    <div class="files-toolbar">
      <nav id="files-breadcrumb" class="files-breadcrumb" data-i18n-aria-label="files.breadcrumbAriaLabel" aria-label="Current folder"></nav>
      <div class="files-toolbar-actions">
        <label class="tuya-toolbar-toggle">
          <input type="checkbox" id="files-show-hidden">
          <span data-i18n="files.showHidden">show hidden</span>
        </label>
        <button type="button" class="btn btn-details" id="files-refresh-btn" data-i18n-title="files.refresh" title="Refresh">↻</button>
        <button type="button" class="btn btn-secondary" id="files-mkdir-btn" data-i18n="files.newFolderBtn">+ New folder</button>
        <button type="button" class="btn btn-start" id="files-upload-btn" data-i18n="files.uploadBtn">⬆ Upload</button>
        <input type="file" id="files-upload-input" multiple hidden>
      </div>
    </div>

    <div id="files-selection-bar" class="files-selection-bar hidden">
      <span id="files-selection-count"></span>
      <button type="button" class="btn btn-secondary" id="files-move-selected-btn" data-i18n="files.moveBtn">Move</button>
      <button type="button" class="btn btn-remove" id="files-delete-selected-btn" data-i18n="files.deleteBtn">Delete</button>
      <button type="button" class="btn-link" id="files-clear-selection-btn" data-i18n="files.clearSelection">clear selection</button>
    </div>

    <div id="files-uploads" class="files-uploads hidden"></div>

    <div class="table-scroll">
      <table class="data-table files-table">
        <thead>
          <tr>
            <th class="files-check-col"><input type="checkbox" id="files-select-all" data-i18n-aria-label="files.selectAll" aria-label="Select all"></th>
            <th data-i18n="common.name">Name</th>
            <th data-i18n="files.col.size">Size</th>
            <th data-i18n="files.col.modified">Modified</th>
            <th data-i18n="common.actions">Actions</th>
          </tr>
        </thead>
        <tbody id="files-tbody">
          <tr><td colspan="5" class="empty-row" data-i18n="common.loading">loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div id="files-drop-overlay" class="files-drop-overlay hidden">
      <span data-i18n="files.dropHint">Drop files to upload them here</span>
    </div>
  </section>
