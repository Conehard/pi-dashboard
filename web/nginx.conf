server {
    listen 8080;
    server_name _;

    # Login lives in the app itself now (api/src/auth.js - session cookie +
    # a real login screen), not here. nginx just proxies /api/* - including
    # the Cookie request header and Set-Cookie response header, which it
    # passes through unmodified by default, no extra config needed.

    root /usr/share/nginx/html;
    index index.html;

    # index.html itself must never be cached (by the browser or anything
    # sitting between it and this container - some network paths, e.g.
    # mobile "data saver" compression proxies, cache plain filenames by
    # exact URL and ignore normal revalidation). auth.js/style.css carry a
    # ?v= query string too (see index.html/auth.js), which is enough on its
    # own for *those* two - but a stale index.html would mean the new ?v=
    # never gets requested at all, defeating that, so it needs this
    # explicitly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every JS module under src/ (app.js and everything it statically
    # imports - core/*.js, views/*.js) is fetched by nginx-relative-path
    # `import` statements, which can't carry a cache-busting ?v= the way
    # auth.js's dynamic `script.src = 'src/app.js?v=...'` does. Without
    # this, a network path that caches by exact URL and ignores normal
    # revalidation (the same class of bug ?v= was added for - see above)
    # would keep serving a stale module forever, silently, no matter how
    # many times the app itself gets redeployed.
    location ~* ^/src/.*\.js$ {
        add_header Cache-Control "no-cache";
    }

    # Same problem, same fix, for the i18n dictionaries (src/core/i18n.js
    # fetches src/i18n/pt.json / en.json by plain relative path too, with no
    # ?v= of its own) - without this, a stale cached dictionary keeps
    # showing raw translation keys (e.g. "overview.internet.title") for any
    # string added/changed after that cache entry was made, even once
    # index.html/app.js themselves are safely on the new ?v=.
    location ~* ^/src/i18n/.*\.json$ {
        add_header Cache-Control "no-cache";
    }

    # Same problem, same fix again, for each view's template.html
    # (core/dom.js's defineView() fetches it by plain relative path, no ?v=
    # of its own) - without this, a stale cached template keeps rendering
    # old markup for that screen forever, no matter how many times the app
    # gets redeployed.
    location ~* ^/src/views/.*\.html$ {
        add_header Cache-Control "no-cache";
    }

    # Static frontend (HTML/CSS/JS only, no server-side rendering).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live log tail (Server-Sent Events): needs buffering off so lines reach
    # the browser as they're written, and a long read timeout since the
    # connection can sit idle between log lines for a while (the API sends a
    # keep-alive comment every 15s to keep it well under this).
    location ~ ^/api/docker/containers/[^/]+/logs$ {
        proxy_pass http://pi-dashboard-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;
    }

    # Recreate pulls an image before recreating the container, which can
    # take well over the default 5s read timeout on a slow connection/disk -
    # give it much more room.
    location ~ ^/api/docker/containers/[^/]+/recreate$ {
        proxy_pass http://pi-dashboard-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;
    }

    # `docker compose pull/up/down` output (Server-Sent Events) - same
    # buffering-off treatment as the log tail above, plus a very long read
    # timeout since `pull`/`up --build` can legitimately take minutes on a
    # Pi (image downloads, or building cpuminer-opt from source).
    location ~ ^/api/compose/projects/[^/]+/run/[^/]+$ {
        proxy_pass http://pi-dashboard-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 3s;
    }

    # Reading/validating-and-saving a project's compose file: validation
    # shells out to `docker compose config`, a bit slower than a plain read.
    location ~ ^/api/compose/ {
        proxy_pass http://pi-dashboard-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }

    # docker system prune (image/build-cache cleanup) - can take a bit
    # longer than a plain container action on a slow disk.
    location = /api/docker/prune {
        proxy_pass http://pi-dashboard-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 3s;
    }

    # Scheduler job runs ("rodar agora") and backup create/list/download/
    # delete - a manual run can involve a compose pull+up or tar'ing a data
    # dir, so gets more room than a plain read.
    location ~ ^/api/(scheduler|backups)/ {
        proxy_pass http://pi-dashboard-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_connect_timeout 3s;
    }

    # Other container/project actions (start/stop/restart/pause/unpause/
    # remove, and project-level bulk actions). stop/restart pass a 10s grace
    # period to Docker before killing the container, and project actions run
    # one of these per container in the project - both can legitimately take
    # a few seconds longer than a plain read, so this gets more room than the
    # 5s default below (which is for cheap, frequent polling reads only).
    location ~ ^/api/docker/(containers|projects)/ {
        proxy_pass http://pi-dashboard-api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
    }

    # Proxy to the API container. The API itself is never published to the
    # host - it is only reachable from the web container over the internal
    # docker network.
    location /api/ {
        proxy_pass http://pi-dashboard-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
